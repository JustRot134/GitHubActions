name: Run Project

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # позволяет запускать вручную из интерфейса

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup environment
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies and run
        run: |
          npm ci
          npm test
